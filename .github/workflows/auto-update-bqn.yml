name: Auto-update BQN

# Builds CBQN WASM from https://github.com/dzaima/CBQN via
# scripts/build-cbqn-wasm.sh (Docker + Emscripten) and opens a PR with the
# updated wasm/bqn/* artifacts and bumped scripts/known-versions.json.
# Triggered automatically by check-language-updates.yml when dzaima/CBQN's
# latest tag reports a new version.

on:
  workflow_dispatch:
    inputs:
      cbqn_version:
        description: 'New CBQN version tag (e.g. v0.11.0) to record in known-versions.json'
        required: true
        type: string
      issue_number:
        description: 'Optional issue number to close from the PR (leave blank for none)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: auto-update-bqn
  cancel-in-progress: false

jobs:
  build-and-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # Docker pull + native for-build + Singeli + emcc-o3 link
    steps:
      - uses: actions/checkout@v4

      # Docker is preinstalled on ubuntu-latest; nothing to set up.
      - name: Show Docker info
        run: docker --version

      - name: Build CBQN WASM
        run: bash scripts/build-cbqn-wasm.sh

      - name: Update known-versions.json and display strings
        env:
          CBQN_VERSION: ${{ inputs.cbqn_version }}
        run: |
          # known-versions.json stores the raw tag (e.g. v0.11.0).
          tmp=$(mktemp)
          jq --arg v "$CBQN_VERSION" '.cbqn = $v' scripts/known-versions.json > "$tmp"
          mv "$tmp" scripts/known-versions.json
          echo "--- updated known-versions.json ---"
          cat scripts/known-versions.json

          # User-facing displays render as "CBQN X.Y". Strip the leading `v`
          # and collapse the trailing `.0` patch (CBQN tags are X.Y.0); keep a
          # non-zero patch/suffix verbatim so betas still show fully.
          CBQN_RAW="${CBQN_VERSION#v}"
          if [[ "$CBQN_RAW" =~ ^([0-9]+\.[0-9]+)\.0$ ]]; then
            CBQN_DISPLAY="CBQN ${BASH_REMATCH[1]}"
          else
            CBQN_DISPLAY="CBQN ${CBQN_RAW}"
          fi
          echo "Display version: $CBQN_DISPLAY"

          # index.html: scoped to the data-lang="bqn" dropdown item only.
          sed -i -E "/data-lang=\"bqn\"/,/<\/div>/ s|(<span class=\"lang-version\">)CBQN [^<]*(</span>)|\1${CBQN_DISPLAY}\2|" index.html

          # generate-og-languages.cjs: only the BQN row.
          sed -i -E "s|(name: 'BQN',[[:space:]]+version: ')CBQN [^']*(')|\1${CBQN_DISPLAY}\2|" scripts/generate-og-languages.cjs

          echo "--- index.html (BQN dropdown) ---"
          grep -A3 'data-lang="bqn"' index.html | head -5
          echo "--- generate-og-languages.cjs (BQN row) ---"
          grep "name: 'BQN'" scripts/generate-og-languages.cjs

      - name: Compose PR body
        id: body
        env:
          CBQN_VERSION: ${{ inputs.cbqn_version }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          {
            echo "Auto-generated by \`.github/workflows/auto-update-bqn.yml\`."
            echo ""
            echo "- Rebuilt \`wasm/bqn/BQN.js\` and \`wasm/bqn/BQN.wasm\` via \`scripts/build-cbqn-wasm.sh\` (Docker + Emscripten)."
            echo "- Bumped \`scripts/known-versions.json\` CBQN entry to \`${CBQN_VERSION}\`."
            echo "- Synced display strings in \`index.html\` and \`scripts/generate-og-languages.cjs\`."
            echo ""
            echo "Source: https://github.com/dzaima/CBQN (develop)"
            if [ -n "$ISSUE_NUMBER" ]; then
              echo ""
              echo "Closes #${ISSUE_NUMBER}"
            fi
          } > pr-body.md
          echo "wrote pr-body.md ($(wc -c < pr-body.md) bytes)"
          {
            echo 'body<<__EOF__'
            cat pr-body.md
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT_REPO }}
          branch: auto/update-bqn-${{ inputs.cbqn_version }}
          delete-branch: true
          commit-message: "Update BQN to ${{ inputs.cbqn_version }}"
          title: "Update BQN to ${{ inputs.cbqn_version }}"
          body: ${{ steps.body.outputs.body }}
          labels: language-update
          assignees: codereport
          add-paths: |
            wasm/bqn/BQN.js
            wasm/bqn/BQN.wasm
            scripts/known-versions.json
            scripts/generate-og-languages.cjs
            index.html
