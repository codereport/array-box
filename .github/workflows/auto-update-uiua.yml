name: Auto-update Uiua

# Builds Uiua WASM from https://github.com/uiua-lang/uiua via
# scripts/update-uiua-wasm.sh (Rust + wasm-pack) and opens a PR with the
# refreshed wasm/uiua_wasm.* artifacts and bumped scripts/known-versions.json.
# Triggered automatically by check-language-updates.yml when uiua-lang/uiua's
# `latest` tag (which uiua.org/pad mirrors) reports a new Cargo.toml version.

on:
  workflow_dispatch:
    inputs:
      uiua_version:
        description: 'New Uiua version (e.g. 0.19.0-dev.3) to record in known-versions.json'
        required: true
        type: string
      issue_number:
        description: 'Optional issue number to close from the PR (leave blank for none)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: auto-update-uiua
  cancel-in-progress: false

jobs:
  build-and-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        # Official prebuilt installer — much faster than `cargo install wasm-pack`,
        # which the build script falls back to if the binary is absent.
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-uiua-${{ runner.os }}-${{ hashFiles('scripts/update-uiua-wasm.sh') }}
          restore-keys: |
            cargo-uiua-${{ runner.os }}-

      - name: Build Uiua WASM
        run: bash scripts/update-uiua-wasm.sh

      - name: Update known-versions.json and display strings
        env:
          UIUA_VERSION: ${{ inputs.uiua_version }}
        run: |
          # known-versions.json stores the raw Cargo.toml version (e.g. 0.19.0-dev.3).
          tmp=$(mktemp)
          jq --arg v "$UIUA_VERSION" '.uiua = $v' scripts/known-versions.json > "$tmp"
          mv "$tmp" scripts/known-versions.json
          echo "--- updated known-versions.json ---"
          cat scripts/known-versions.json

          # generate-og-languages.cjs: only the Uiua row.
          # Note: index.html's <span id="uiua-version"> is populated at runtime
          # by uiua_wasm.js's exported uiua_version() function, so no static
          # substitution is needed there.
          sed -i -E "s|(name: 'Uiua',[[:space:]]+version: ')[^']*(')|\1${UIUA_VERSION}\2|" scripts/generate-og-languages.cjs

          echo "--- generate-og-languages.cjs (Uiua row) ---"
          grep "name: 'Uiua'" scripts/generate-og-languages.cjs

      - name: Compose PR body
        id: body
        env:
          UIUA_VERSION: ${{ inputs.uiua_version }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          {
            echo "Auto-generated by \`.github/workflows/auto-update-uiua.yml\`."
            echo ""
            echo "- Rebuilt \`wasm/uiua_wasm.js\` and \`wasm/uiua_wasm_bg.wasm\` via \`scripts/update-uiua-wasm.sh\` (Rust + wasm-pack)."
            echo "- Bumped \`scripts/known-versions.json\` Uiua entry to \`${UIUA_VERSION}\`."
            echo "- Synced \`scripts/generate-og-languages.cjs\` Uiua row."
            echo ""
            echo "Source: https://github.com/uiua-lang/uiua (\`latest\` tag mirrors uiua.org/pad)."
            echo ""
            echo "_The dropdown version display in \`index.html\` is populated at runtime from the WASM module's \`uiua_version()\` export, so it does not require a static change._"
            if [ -n "$ISSUE_NUMBER" ]; then
              echo ""
              echo "Closes #${ISSUE_NUMBER}"
            fi
          } > pr-body.md
          echo "wrote pr-body.md ($(wc -c < pr-body.md) bytes)"
          {
            echo 'body<<__EOF__'
            cat pr-body.md
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/update-uiua-${{ inputs.uiua_version }}
          delete-branch: true
          commit-message: "Update Uiua to ${{ inputs.uiua_version }}"
          title: "Update Uiua to ${{ inputs.uiua_version }}"
          body: ${{ steps.body.outputs.body }}
          labels: language-update
          assignees: codereport
          add-paths: |
            wasm/uiua_wasm.js
            wasm/uiua_wasm_bg.wasm
            scripts/known-versions.json
            scripts/generate-og-languages.cjs
